version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wrapcheck
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use o logger com redação de campos sensíveis
        - pattern: ^log\.Print.*$
          msg: use o logger com redação de campos sensíveis
        - pattern: github\.com/signalapp
          msg: o servidor não pode linkar libsignal (AGPL, ADR-0004)
  exclusions:
    generated: lax
    paths:
      - gen/
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/falaai-br
