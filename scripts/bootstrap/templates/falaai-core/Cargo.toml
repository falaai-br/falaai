[package]
name = "falaai-core"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Núcleo criptográfico e de mensagens do FalaAí"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# libsignal: dependência git pinada por commit (ADR-0001). Definida na bead da Fase 0.
# libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "<COMMIT>" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
